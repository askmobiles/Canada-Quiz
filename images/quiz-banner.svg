<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Colorful quiz banner with a globe, book, and question marks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3f4"/><stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" fill="url(#qbg)"/>
  <!-- floating question marks -->
  <text x="120" y="120" font-family="Arial, sans-serif" font-size="70" font-weight="900" fill="#e63946" opacity=".85">?</text>
  <text x="840" y="220" font-family="Arial, sans-serif" font-size="90" font-weight="900" fill="#4895ef" opacity=".8">?</text>
  <text x="720" y="90" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#ffb703" opacity=".9">?</text>
  <!-- stars -->
  <text x="250" y="70" font-size="34">⭐</text>
  <text x="620" y="250" font-size="30">✨</text>
  <!-- globe -->
  <g transform="translate(400,150)">
    <circle r="82" fill="#4895ef"/>
    <path d="M-82 0 h164 M-70 -42 h140 M-70 42 h140" stroke="#eaf3ff" stroke-width="4" fill="none" opacity=".7"/>
    <ellipse rx="34" ry="82" fill="none" stroke="#eaf3ff" stroke-width="4" opacity=".7"/>
    <path d="M-55 -30 q20 -14 44 -4 q26 10 10 34 q-16 22 8 34 q-40 6 -66 -18 q-16 -30 4 -46z" fill="#2a9d8f"/>
    <path d="M20 20 q26 -6 40 10 q-6 26 -34 30 q-24 -14 -6 -40z" fill="#2a9d8f"/>
  </g>
  <!-- open book -->
  <g transform="translate(560,175)">
    <path d="M0 0 q40 -22 92 -10 v70 q-52 -12 -92 10 z" fill="#e63946"/>
    <path d="M0 0 q-40 -22 -92 -10 v70 q52 -12 92 10 z" fill="#f4845f"/>
    <line x1="0" y1="0" x2="0" y2="70" stroke="#c1121f" stroke-width="3"/>
  </g>
  <!-- maple leaf accent -->
  <g transform="translate(300,205) scale(0.5)">
    <polygon fill="#e63946" points="50,8 56,26 72,20 66,34 88,34 74,46 84,54 66,54 72,72 58,60 56,80 44,80 42,60 28,72 34,54 16,54 26,46 12,34 34,34 28,20 44,26"/>
  </g>
</svg>
